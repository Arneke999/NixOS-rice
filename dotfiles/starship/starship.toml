# Starship prompt — Catppuccin Mocha (pink accent), static.
# Style: lean/Pure (à la zenities) — single line, no icons, no filler words,
# subtle grey git, coloured ❯. Command time is right-aligned.
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
palette = "mocha"
# NOTE: format/right_format MUST stay above the first [table] header, or TOML
# folds them into that table and starship silently falls back to its default.
format = "$directory$git_branch$git_status$character"
right_format = "$cmd_duration"

[palettes.mocha]
primary   = "#f5c2e7"
secondary = "#cba6f7"
tertiary  = "#b4befe"
error     = "#f38ba8"
muted     = "#585b70"
text      = "#cdd6f4"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "primary"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = ""
read_only = " "
read_only_style = "error"

[git_branch]
format = "[$branch]($style) "
symbol = ""
style = "muted"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "muted"
conflicted = "="
untracked = "?"
modified = "*"
staged = "+"
renamed = "»"
deleted = "✘"
stashed = "≡"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

[cmd_duration]
min_time = 500
style = "muted"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](primary)"
error_symbol = "[❯](error)"
vimcmd_symbol = "[❮](secondary)"
