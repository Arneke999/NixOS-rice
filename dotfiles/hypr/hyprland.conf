# Hyprland — the working desktop. Dynamic (dwindle) tiling: one window fills the
# screen, a second auto-splits beside it, a fresh workspace opens empty. NO analog
# texture here — the CRT/scanline look lives ONLY on hyprlock + the boot splash.
#
# Colors are Catppuccin Mocha (pink accent), baked in — edit the hexes here directly.
# Ported 1:1 from the old niri config.kdl.
#
# Docs: https://wiki.hyprland.org/Configuring/

$mod = SUPER

# ── Monitors ───────────────────────────────────────────────────────────────
# The VM's virtual output, pinned to 1920x1200 (its "preferred" mode is a small
# 1280x800, so it must be set explicitly). The catch-all below covers the laptop's
# eDP-1 at its preferred mode, so the config stays portable without editing.
monitor = Virtual-1, 1920x1200@60, auto, 1
monitor = , preferred, auto, 1

# ── Environment ──────────────────────────────────────────────────────────────
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,20

# ── Startup ──────────────────────────────────────────────────────────────────
# NOTE: no boot-time auto-lock here anymore. Login is now a real pre-session
# greeter (ReGreet, services.greetd in the NixOS config) that authenticates
# BEFORE Hyprland starts, so locking again on launch would just be a second
# password prompt. hyprlock still handles idle-lock (hypridle) and the manual
# Super+Alt+L bind below.
# Make portals / screenshare see the running session.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Bar (eww).
exec-once = eww open bar
# Notification daemon (swaync).
exec-once = swaync
# Idle daemon: locks (hyprlock) after 5 min, DPMS-off shortly after.
exec-once = hypridle
# Dark GTK / libadwaita prefs (dconf).
exec-once = ~/nix-config/dotfiles/scripts/gtk-theme.sh
# Restore the last-used wallpaper on login (no arg → reads ~/.cache/wallpaper).
exec-once = ~/nix-config/dotfiles/scripts/set-wallpaper.sh

# ── Input ────────────────────────────────────────────────────────────────────
input {
    numlock_by_default = true
    # kb_layout is left empty so it inherits the system locale (localectl),
    # matching the old niri behavior. Set it here if you want azerty etc.
    follow_mouse = 1
    # Pointer speed (libinput accel, range -1.0 … 1.0). Bumped up because the
    # touchpad felt sluggish — you had to drag a long way to move the cursor.
    # Tune to taste; lower if it now feels too twitchy.
    sensitivity = 0.5
    touchpad {
        natural_scroll = true
        tap-to-click = true
        # Larger multiplier = less finger travel to cross the screen.
        scroll_factor = 1.0
    }
}

cursor {
    inactive_timeout = 0
}

# ── Layout & look ────────────────────────────────────────────────────────────
general {
    gaps_in = 4       # between windows (tightened — 8+8 felt too airy)
    gaps_out = 8      # screen edges
    border_size = 2   # was niri focus-ring width 2
    # Active border = Catppuccin pink; inactive is a muted grey.
    col.active_border = rgb(f5c2e7)
    col.inactive_border = rgb(505050)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8      # was niri geometry-corner-radius 8
    # Flat, disciplined desktop — no blur, no shadow (texture lives on hyprlock).
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0   # awww paints the wallpaper, not Hyprland
}

# ── Animations ───────────────────────────────────────────────────────────────
# Buttery but crisp. easeOutQuint at 450–550ms read "smooth but ~30fps" — its tail
# decelerates so hard that the final stretch shows per-frame stepping on a 60Hz
# panel. Fix: `butter` is now easeOutCubic (brisk, clean finish — no crawl) and
# durations are shorter (~320–360ms), so motion still glides but resolves before
# the tail can visibly step. NOTE: Hyprland 0.55 removed the misc:vfr /
# render:explicit_sync knobs (explicit sync is always-on via aquamarine now), so
# curve + duration is the only lever here. If it STILL reads like 30fps it's
# genuine frame pacing (ARL + aquamarine) → revisit under the laptop power work
# (GPU staying clocked down on battery).
animations {
    enabled = true
    bezier = butter,   0.33, 1.0, 0.68, 1.0    # easeOutCubic — smooth glide, brisk finish
    bezier = smoothIO, 0.65, 0.0,  0.35, 1.0   # easeInOutCubic — for window moves
    bezier = gentle,   0.25, 0.46, 0.45, 0.94  # soft ease for fades/borders

    animation = windows,     1, 3.2, butter,   popin 96%
    animation = windowsIn,   1, 3.2, butter,   popin 96%
    animation = windowsOut,  1, 2.6, butter,   popin 96%
    animation = windowsMove, 1, 3.0, smoothIO
    animation = fade,        1, 2.6, gentle
    animation = border,      1, 5.0, gentle
    animation = workspaces,  1, 3.6, butter,   slide
}

# ── Window rules ─────────────────────────────────────────────────────────────
# Firefox picture-in-picture floats (both host + flatpak Firefox). Note: this
# Hyprland build wants "rule matcher" (space), NOT the older comma "rule, matcher".
windowrule = float title:^(Picture-in-Picture)$

# ── Binds ────────────────────────────────────────────────────────────────────
# "Mod" was niri's Super; here $mod = SUPER. Layout is dynamic tiling now, so the
# niri column/scroll binds are replaced by their dwindle equivalents.

# Apps.
bind = $mod, Space, exec, kitty
bind = ALT, Space, exec, fuzzel
bind = $mod, B, exec, brave
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, N, exec, swaync-client -d -sw
# Lock via logind so hypridle catches the signal and runs hyprlock.
bind = SUPER ALT, L, exec, loginctl lock-session
# Reset to the default wallpaper (lain.jpg).
bind = $mod SHIFT, W, exec, ~/nix-config/dotfiles/scripts/set-wallpaper.sh ~/nix-config/wallpapers/lain.jpg
# Screen reader toggle (works while locked).
bindl = SUPER ALT, S, exec, pkill orca || orca

# Window management.
bind = $mod, Q, killactive
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen, 1        # maximize (keeps bar/gaps) — was niri maximize-column
bind = $mod SHIFT, F, fullscreen, 0  # true fullscreen — was niri fullscreen-window
bind = $mod, R, layoutmsg, togglesplit  # flip dwindle split — replaces niri preset widths
bind = $mod, W, exec, ~/nix-config/dotfiles/scripts/wall-picker.sh  # wallpaper picker (fuzzel)
bind = $mod, G, togglegroup          # tabbed group — closest to niri tabbed column (moved off W)
bind = $mod, Tab, changegroupactive  # cycle within a group

# Focus (arrows + vim keys).
bind = $mod, left,  movefocus, l
bind = $mod, down,  movefocus, d
bind = $mod, up,    movefocus, u
bind = $mod, right, movefocus, r
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, exec, pkill wlogout || wlogout -b 5 -p layer-shell  # power menu, one row of icons (movefocus-right stays on $mod+right)

# Move window.
bind = $mod CTRL, left,  movewindow, l
bind = $mod CTRL, down,  movewindow, d
bind = $mod CTRL, up,    movewindow, u
bind = $mod CTRL, right, movewindow, r
bind = $mod CTRL, H, movewindow, l
bind = $mod CTRL, J, movewindow, d
bind = $mod CTRL, K, movewindow, u
bind = $mod CTRL, L, movewindow, r

# Focus monitor.
bind = $mod SHIFT, left,  focusmonitor, l
bind = $mod SHIFT, right, focusmonitor, r
bind = $mod SHIFT, H, focusmonitor, l
bind = $mod SHIFT, L, focusmonitor, r

# Move window to monitor.
bind = $mod SHIFT CTRL, left,  movewindow, mon:l
bind = $mod SHIFT CTRL, right, movewindow, mon:r
bind = $mod SHIFT CTRL, H, movewindow, mon:l
bind = $mod SHIFT CTRL, L, movewindow, mon:r

# Resize (repeatable).
binde = $mod, minus, resizeactive, -10% 0
binde = $mod, equal, resizeactive, 10% 0
binde = $mod SHIFT, minus, resizeactive, 0 -10%
binde = $mod SHIFT, equal, resizeactive, 0 10%

# Workspaces: next/prev (Page keys + U/I, matching the old niri binds).
bind = $mod, Page_Down, workspace, +1
bind = $mod, Page_Up,   workspace, -1
bind = $mod, U, workspace, +1
bind = $mod, I, workspace, -1
bind = $mod CTRL, Page_Down, movetoworkspace, +1
bind = $mod CTRL, Page_Up,   movetoworkspace, -1
bind = $mod CTRL, U, movetoworkspace, +1
bind = $mod CTRL, I, movetoworkspace, -1

# Workspaces by number.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
# Move the focused window to a workspace by number (Super+Shift+N — CachyOS habit).
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# Mouse wheel over the desktop cycles workspaces (was Mod+Wheel in niri).
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
# Drag to move / resize floating windows.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Session.
bind = $mod SHIFT, E, exit
bind = CTRL ALT, Delete, exit
bind = $mod SHIFT, P, dpms, off   # blank monitors; any input wakes them

# Screenshots (screenshot.sh: grim + slurp + wl-clipboard). Each mode copies to the
# clipboard AND saves a PNG to ~/Pictures/Screenshots, then notifies with a preview.
bind = , Print, exec, ~/nix-config/dotfiles/scripts/screenshot.sh region
# Super+Shift+S: same region-select screenshot (Windows/Snip muscle memory).
bind = $mod SHIFT, S, exec, ~/nix-config/dotfiles/scripts/screenshot.sh region
bind = CTRL, Print, exec, ~/nix-config/dotfiles/scripts/screenshot.sh full
bind = ALT, Print, exec, ~/nix-config/dotfiles/scripts/screenshot.sh window

# Media / brightness keys (work while locked, repeatable where it makes sense).
# Routed through the eww helpers so the bar widget updates instantly (they change
# the value AND push it to eww); the mic-mute has no widget so it stays direct.
bindel = , XF86AudioRaiseVolume,  exec, ~/nix-config/dotfiles/eww/scripts/vol-ctl.sh up
bindel = , XF86AudioLowerVolume,  exec, ~/nix-config/dotfiles/eww/scripts/vol-ctl.sh down
bindl  = , XF86AudioMute,         exec, ~/nix-config/dotfiles/eww/scripts/vol-ctl.sh mute
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, ~/nix-config/dotfiles/eww/scripts/bri-ctl.sh up
bindel = , XF86MonBrightnessDown, exec, ~/nix-config/dotfiles/eww/scripts/bri-ctl.sh down
