# ── kitty — Catppuccin Mocha (pink accent) ───────────────────────────────────
# Near-black fixed background; Catppuccin accents (cursor/selection/links). Static.

# Don't nag when closing a window with nothing running.
confirm_os_window_close 0

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Feel
window_padding_width  10
cursor_shape          beam
cursor_blink_interval 0
scrollback_lines      10000
enable_audio_bell     no
background_opacity     1.0
# Remove the client-side titlebar/decorations (the gray bar niri/kitty draws on top).
hide_window_decorations yes
# Hide the tab bar entirely unless there are 2+ tabs (no ugly header on a single tab).
tab_bar_min_tabs      2
tab_bar_edge          bottom
tab_bar_style         powerline
tab_title_template    "{index}: {title}"

# ── Colors ───────────────────────────────────────────────────────────────────
# Background is pinned near-black (rice's fixed-background rule); text and chrome
# (cursor, selection, links, borders, tabs) are Catppuccin Mocha (pink accent).
background           #0f0f11
foreground           #cdd6f4
selection_background #f5c2e7
selection_foreground #0f0f11
cursor               #f5c2e7
cursor_text_color    #0f0f11
url_color            #b4befe

active_border_color   #f5c2e7
inactive_border_color #1e1e22

active_tab_background   #f5c2e7
active_tab_foreground   #0f0f11
inactive_tab_background #16161a
inactive_tab_foreground #cdd6f4

# 16-color ANSI palette — Catppuccin Mocha's official terminal mapping, so shell
# colors (ls, git diff, prompts) match the rest of the rice.
# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8

# ── Keys ─────────────────────────────────────────────────────────────────────
# Ctrl +/- zoom the font (like a browser); Ctrl+0 resets. Ctrl isn't a Hyprland
# modifier for these keys, so they pass straight through to the focused terminal.
map ctrl+equal        change_font_size all +2.0
map ctrl+plus         change_font_size all +2.0
map ctrl+kp_add       change_font_size all +2.0
map ctrl+minus        change_font_size all -2.0
map ctrl+kp_subtract  change_font_size all -2.0
map ctrl+0            change_font_size all 0
