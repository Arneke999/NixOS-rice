# fuzzel config for the wallpaper picker (Super+W). Same look as the Alt+Space
# launcher (fuzzel.ini) but with icons ON, so each row shows a small thumbnail of
# the wallpaper. Catppuccin Mocha (pink accent) — edit the hexes here directly.
[main]
font=JetBrainsMono Nerd Font:size=12
icons-enabled=yes
lines=8
width=36
horizontal-pad=18
vertical-pad=14
inner-pad=12

[colors]
background=0f0f11f2
text=cdd6f4ff
prompt=b4befeff
placeholder=8a8a90ff
input=c8c8ceff
match=f5c2e7ff
selection=f5c2e726
selection-text=e8e8eeff
selection-match=f5c2e7ff
counter=8a8a90ff
border=cba6f7ff

[border]
width=1
radius=12
