[main]
font=JetBrainsMono Nerd Font:size=11
# App icons in the launcher (Alt+Space), themed to match the desktop's GTK icons.
icons-enabled=yes
icon-theme=Papirus-Dark
lines=8
width=32
horizontal-pad=18
vertical-pad=14
inner-pad=10

[colors]
background=0f0f11f2
text=cdd6f4ff
prompt=b4befeff
placeholder=8a8a90ff
input=c8c8ceff
match=f5c2e7ff
selection=f5c2e726
selection-text=e8e8eeff
selection-match=f5c2e7ff
counter=8a8a90ff
border=cba6f7ff

[border]
width=1
radius=12
